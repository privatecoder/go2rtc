name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Test
        run: |
          go vet ./pkg/bc/... ./internal/bc/...
          go test -race ./pkg/bc/...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: 0 }
    strategy:
      matrix:
        include:
          - { name: go2rtc_win64,         goos: windows, goarch: amd64, zip: true }
          - { name: go2rtc_win32,         goos: windows, goarch: '386', zip: true }
          - { name: go2rtc_win_arm64,     goos: windows, goarch: arm64, zip: true }
          - { name: go2rtc_linux_amd64,   goos: linux,   goarch: amd64 }
          - { name: go2rtc_linux_i386,    goos: linux,   goarch: '386' }
          - { name: go2rtc_linux_arm64,   goos: linux,   goarch: arm64 }
          - { name: go2rtc_linux_arm,     goos: linux,   goarch: arm, goarm: '7' }
          - { name: go2rtc_linux_armv6,   goos: linux,   goarch: arm, goarm: '6' }
          - { name: go2rtc_linux_mipsel,  goos: linux,   goarch: mipsle }
          - { name: go2rtc_mac_amd64,     goos: darwin,  goarch: amd64, zip: true }
          - { name: go2rtc_mac_arm64,     goos: darwin,  goarch: arm64, zip: true }
          - { name: go2rtc_freebsd_amd64, goos: freebsd, goarch: amd64 }
          - { name: go2rtc_freebsd_arm64, goos: freebsd, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir dist
          if [ "${{ matrix.zip }}" = "true" ]; then
            bin=go2rtc; [ "$GOOS" = windows ] && bin=go2rtc.exe
            go build -ldflags "-s -w" -trimpath -o "$bin"
            zip -9 "dist/${{ matrix.name }}.zip" "$bin"
          else
            go build -ldflags "-s -w" -trimpath -o "dist/${{ matrix.name }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: dist/* }

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" --verify-tag
          fi
